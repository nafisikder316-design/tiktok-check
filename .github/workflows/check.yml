name: Check TikTok

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Check for new posts
        run: python check.py
        env:
          TIKTOK_USER: ${{ secrets.TIKTOK_USER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save seen videos
        run: |
          git config user.name "checker-bot"
          git config user.email "checker-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || (git commit -m "update seen videos" && git push)
